name: Build and deploy web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test native engine
        run: cargo test --locked
      - name: Verify legal move generation (perft)
        shell: bash
        run: |
          cargo build --locked --release
          check_perft() {
            local expected="$1"
            shift
            local output
            output="$(./target/release/shogi-rsi perft "$@")"
            echo "$output"
            if ! grep -Eq "(^|[^0-9])${expected}([^0-9]|$)" <<< "$output"; then
              echo "::error::Expected perft count $expected for depth $1"
              exit 1
            fi
          }
          check_perft 719731 4
          check_perft 4809015 3 'l6nl/5+P1gk/2np1S3/p1p4Pp/3P2Sp1/1PPb2P1P/P5GS1/R8/LN4bKL w RGgsn5p 1'
      - name: Build static app
        run: sh scripts/build-web.sh
      - name: Test WebAssembly engine and worker
        run: node tests/web-engine.mjs
      - name: Test offline cache and Pages paths
        run: node tests/web-offline.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
